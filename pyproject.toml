[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-bayern-ticketfinder"
version = "0.1.0"
description = "A local CLI monitor for eligible FC Bayern ticket listings on Regiondo."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
ticketfinder = "ticketfinder:main"

[tool.setuptools]
py-modules = ["ticketfinder"]
